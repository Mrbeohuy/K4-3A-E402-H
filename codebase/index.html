<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI20k Study Assistant - CP3</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="card">

            <div class="badge">CP3 — BACKEND AI DECISION</div>

            <h1>Trợ lý học viên AI20k</h1>

            <p class="description">
                Hỏi về nội dung bài học của khóa AI20k.
                Khi backend có GEMINI_API_KEY, quyết định trung tâm do Gemini thực hiện.
            </p>

            <div class="example">
                Ví dụ:
                <button onclick="setExample('LLM hoạt động như thế nào?')">
                    LLM hoạt động như thế nào?
                </button>

                <button onclick="setExample('cái này là sao?')">
                    Câu hỏi mơ hồ
                </button>

                <button onclick="setExample('Hướng dẫn tôi làm bánh mì')">
                    Ngoài phạm vi
                </button>
            </div>

            <label for="question">
                Câu hỏi của bạn
            </label>

            <textarea
                id="question"
                placeholder="Ví dụ: LLM hoạt động như thế nào?"
                rows="4"
            ></textarea>

            <button
                id="sendButton"
                class="primary-button"
                onclick="askQuestion()"
            >
                Gửi câu hỏi
            </button>

            <div id="result" class="result hidden"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
